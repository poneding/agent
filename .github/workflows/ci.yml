name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run quality gate
        run: cargo xtask ci

      - name: Upload quality gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruse-ci-quality-gate
          path: target/ruse-ci
          if-no-files-found: warn
