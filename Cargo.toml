[workspace]
members = [
    "crates/ruse-types",
    "crates/ruse-model",
    "crates/ruse-storage",
    "crates/ruse-telemetry",
    "crates/ruse-eval",
    "crates/ruse-core",
    "crates/ruse-tool",
    "crates/ruse-policy",
    "crates/ruse-sandbox",
    "crates/ruse-scheduler",
    "crates/ruse-worktree",
    "crates/ruse-team",
    "crates/ruse-context",
    "crates/ruse-memory",
    "crates/ruse-mcp",
    "crates/ruse-skill",
    "crates/ruse-plugin",
    "crates/ruse-ui-bridge",
    "crates/ruse-desktop",
    "crates/ruse-cli",
    "crates/ruse-tui",
    "apps/desktop/src-tauri",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Pone Ding <poneding@gmail.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
