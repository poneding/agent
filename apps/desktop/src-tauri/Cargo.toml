[package]
name = "ruse-desktop-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "ruse_desktop_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
ruse-core = { path = "../../../crates/ruse-core" }
ruse-desktop = { path = "../../../crates/ruse-desktop" }
ruse-storage = { path = "../../../crates/ruse-storage" }
ruse-types = { path = "../../../crates/ruse-types" }
ruse-ui-bridge = { path = "../../../crates/ruse-ui-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
