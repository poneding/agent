<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ruse">
  <defs>
    <linearGradient id="plate" gradientUnits="userSpaceOnUse" x1="24" y1="18" x2="104" y2="110">
      <stop offset="0" stop-color="#f4ffb0"/>
      <stop offset="0.35" stop-color="#d6f078"/>
      <stop offset="0.7" stop-color="#9ed63a"/>
      <stop offset="1" stop-color="#5f9a28"/>
    </linearGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="20" y1="110" x2="108" y2="20">
      <stop offset="0" stop-color="#7fd4cc" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#7fd4cc" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff6a8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="64" y1="14" x2="64" y2="70">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bevel" gradientUnits="userSpaceOnUse" x1="64" y1="14" x2="64" y2="114">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.2" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.8" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="50" y1="36" x2="80" y2="92">
      <stop offset="0" stop-color="#1a220f"/>
      <stop offset="1" stop-color="#0c1208"/>
    </linearGradient>
    <clipPath id="plateClip">
      <rect x="14" y="14" width="100" height="100" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="64" cy="112" rx="40" ry="8" fill="#000000" opacity="0.28"/>

  <!-- plate -->
  <rect x="14" y="14" width="100" height="100" rx="28" ry="28" fill="url(#plate)"/>
  <rect x="14" y="14" width="100" height="100" rx="28" ry="28" fill="url(#rim)"/>
  <rect x="14" y="14" width="100" height="100" rx="28" ry="28" fill="url(#bevel)"/>

  <!-- glass sheen -->
  <g clip-path="url(#plateClip)">
    <path d="M14 44 C34 22 94 18 114 38 L114 14 L14 14 Z" fill="url(#sheen)"/>
    <circle cx="42" cy="40" r="26" fill="#ffffff" opacity="0.1"/>
  </g>

  <!-- highlight ring -->
  <rect x="16" y="16" width="96" height="96" rx="26" ry="26"
        fill="none" stroke="#f7ffc8" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- geometric R (evenodd hole) -->
  <path fill="url(#glyph)" fill-rule="evenodd"
        d="M44 36 H73 C85 36 93 43.5 93 54.5 C93 63.2 87.8 69.2 79.5 71.2 L95 92 H81.5 L67.8 72.4 H56.5 V92 H44 V36 Z
           M56.5 47.2 V61.5 H71 C76.6 61.5 80 58.6 80 54.2 C80 49.8 76.6 47.2 71 47.2 H56.5 Z"/>

  <!-- emboss edge on R -->
  <path fill="none" stroke="#f0ffb0" stroke-opacity="0.3" stroke-width="1.3" stroke-linecap="round"
        d="M45.6 37.6 H72 C82.8 37.6 90.5 44.4 90.5 54.5 C90.5 62 86.2 67.4 79 69.4"/>

  <!-- agent spark -->
  <circle cx="94" cy="34" r="5.4" fill="#8ec5c0"/>
  <circle cx="94" cy="34" r="2.5" fill="#f7ffef"/>
  <circle cx="94" cy="34" r="7.6" fill="none" stroke="#8ec5c0" stroke-opacity="0.5" stroke-width="1.2"/>
</svg>
