[package]
name = "agent-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "agent"
path = "src/bin/agent.rs"

[[bin]]
name = "agent-cli"
path = "src/bin/agent-cli.rs"

[features]
default = ["mcp"]
## Optional MCP management surface. The coding TUI loop does not require MCP;
## `agent-core` can also be built with `--no-default-features` to drop agent-mcp.
mcp = ["dep:agent-mcp", "agent-core/mcp"]

[dependencies]
agent-context = { path = "../agent-context" }
agent-core = { path = "../agent-core", default-features = false }
agent-eval = { path = "../agent-eval" }
agent-memory = { path = "../agent-memory" }
agent-mcp = { path = "../agent-mcp", optional = true }
agent-model = { path = "../agent-model" }
agent-plugin = { path = "../agent-plugin" }
agent-policy = { path = "../agent-policy" }
agent-sandbox = { path = "../agent-sandbox" }
agent-scheduler = { path = "../agent-scheduler" }
agent-skill = { path = "../agent-skill" }
agent-storage = { path = "../agent-storage" }
agent-team = { path = "../agent-team" }
agent-tool = { path = "../agent-tool" }
agent-types = { path = "../agent-types" }
agent-tui = { path = "../agent-tui" }
agent-ui-bridge = { path = "../agent-ui-bridge" }
agent-worktree = { path = "../agent-worktree" }
camino = { version = "1" }
crossterm = "0.28.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
