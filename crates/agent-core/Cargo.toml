[package]
name = "agent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
agent-model = { path = "../agent-model" }
agent-policy = { path = "../agent-policy" }
agent-sandbox = { path = "../agent-sandbox" }
agent-storage = { path = "../agent-storage" }
agent-tool = { path = "../agent-tool" }
agent-types = { path = "../agent-types" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
agent-context = { path = "../agent-context" }
agent-memory = { path = "../agent-memory" }
agent-plugin = { path = "../agent-plugin" }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
