[package]
name = "agent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["mcp"]
## MCP sampling bridge. Coding-agent TUI path can build with
## `--no-default-features` to drop the agent-mcp dependency from core.
mcp = ["dep:agent-mcp"]

[dependencies]
agent-context = { path = "../agent-context" }
agent-memory = { path = "../agent-memory" }
agent-mcp = { path = "../agent-mcp", optional = true }
agent-model = { path = "../agent-model" }
agent-policy = { path = "../agent-policy" }
agent-sandbox = { path = "../agent-sandbox" }
agent-scheduler = { path = "../agent-scheduler" }
agent-storage = { path = "../agent-storage" }
agent-telemetry = { path = "../agent-telemetry" }
agent-tool = { path = "../agent-tool" }
agent-types = { path = "../agent-types" }
agent-worktree = { path = "../agent-worktree" }
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[dev-dependencies]
agent-plugin = { path = "../agent-plugin" }
agent-mcp = { path = "../agent-mcp" }
futures = "0.3"

[lints]
workspace = true
