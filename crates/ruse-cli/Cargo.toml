[package]
name = "ruse-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ruse"
path = "src/bin/ruse.rs"

[[bin]]
name = "ruse-cli"
path = "src/bin/ruse-cli.rs"

[features]
default = ["mcp"]
## Optional MCP management surface. The coding TUI loop does not require MCP;
## `ruse-core` can also be built with `--no-default-features` to drop ruse-mcp.
mcp = ["dep:ruse-mcp", "ruse-core/mcp"]

[dependencies]
ruse-context = { path = "../ruse-context" }
ruse-core = { path = "../ruse-core", default-features = false }
ruse-eval = { path = "../ruse-eval" }
ruse-memory = { path = "../ruse-memory" }
ruse-mcp = { path = "../ruse-mcp", optional = true }
ruse-model = { path = "../ruse-model" }
ruse-plugin = { path = "../ruse-plugin" }
ruse-policy = { path = "../ruse-policy" }
ruse-sandbox = { path = "../ruse-sandbox" }
ruse-scheduler = { path = "../ruse-scheduler" }
ruse-skill = { path = "../ruse-skill" }
ruse-storage = { path = "../ruse-storage" }
ruse-team = { path = "../ruse-team" }
ruse-tool = { path = "../ruse-tool" }
ruse-types = { path = "../ruse-types" }
ruse-tui = { path = "../ruse-tui", features = ["syntect"] }
ruse-markdown = { path = "../ruse-markdown", features = ["syntect"] }
ruse-ui-bridge = { path = "../ruse-ui-bridge" }
ruse-worktree = { path = "../ruse-worktree" }
camino = { version = "1" }
crossterm = "0.28.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
