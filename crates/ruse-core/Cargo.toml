[package]
name = "ruse-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["mcp"]
## MCP sampling bridge. Coding-agent TUI path can build with
## `--no-default-features` to drop the ruse-mcp dependency from core.
mcp = ["dep:ruse-mcp"]

[dependencies]
ruse-context = { path = "../ruse-context" }
ruse-memory = { path = "../ruse-memory" }
ruse-mcp = { path = "../ruse-mcp", optional = true }
ruse-model = { path = "../ruse-model" }
ruse-policy = { path = "../ruse-policy" }
ruse-sandbox = { path = "../ruse-sandbox" }
ruse-scheduler = { path = "../ruse-scheduler" }
ruse-storage = { path = "../ruse-storage" }
ruse-telemetry = { path = "../ruse-telemetry" }
ruse-tool = { path = "../ruse-tool" }
ruse-types = { path = "../ruse-types" }
ruse-worktree = { path = "../ruse-worktree" }
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[dev-dependencies]
ruse-plugin = { path = "../ruse-plugin" }
ruse-mcp = { path = "../ruse-mcp" }
futures = "0.3"

[lints]
workspace = true
