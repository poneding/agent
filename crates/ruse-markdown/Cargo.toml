[package]
name = "ruse-markdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Markdown parse (pulldown-cmark) to structured IR plus terminal/ANSI render helpers"

[features]
default = []
## Optional syntax highlighting for fenced code blocks via syntect.
syntect = ["dep:syntect"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
unicode-width = "0.2"
syntect = { version = "5.2", optional = true, default-features = false, features = [
    "default-fancy",
] }

[dev-dependencies]
pretty_assertions = "1"

[lints]
workspace = true
